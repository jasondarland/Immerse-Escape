[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immerse-remote-occ"
version = "0.1.0"
description = "IMMERSE Remote OCC – Escape Room Operator"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
