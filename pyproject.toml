[project]
name = "immerse-escape-simulator"
version = "0.1.0"
description = "IMMERSE Escape Simulator desktop app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[project.scripts]
immerse-escape-simulator = "immerse_simulator.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
